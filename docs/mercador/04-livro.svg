<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740" font-family="'Liberation Sans','DejaVu Sans',sans-serif">
<rect width="360" height="740" fill="#0b0d10"/>
<rect width="360" height="64" fill="#10141a"/><line x1="0" y1="64" x2="360" y2="64" stroke="#262d36"/>
<text x="16" y="30" fill="#d8dde3" font-family="'DejaVu Serif',Georgia,serif" font-size="19" letter-spacing="1">LIVRO DE CONTAS</text>
<text x="16" y="50" fill="#7c8793" font-size="11" font-family="'DejaVu Sans Mono',monospace">o que você fez · não pode ser apagado</text>
<!-- quem você é -->
<text x="16" y="90" fill="#7c8793" font-size="10" letter-spacing="2">QUEM VOCÊ ESTÁ SE TORNANDO</text>
<g font-size="11">
  <rect x="14" y="100" width="92" height="26" rx="13" fill="#161c24" stroke="#d9a441"/><text x="60" y="117" fill="#d9a441" text-anchor="middle">Calejado</text>
  <rect x="114" y="100" width="82" height="26" rx="13" fill="#161c24" stroke="#8b6fc4"/><text x="155" y="117" fill="#8b6fc4" text-anchor="middle">Insone</text>
  <rect x="204" y="100" width="82" height="26" rx="13" fill="#161c24" stroke="#c0392b"/><text x="245" y="117" fill="#c0392b" text-anchor="middle">Devedor</text>
  <rect x="14" y="134" width="150" height="26" rx="13" fill="#161c24" stroke="#3a444f" stroke-dasharray="3 3"/><text x="89" y="151" fill="#7c8793" text-anchor="middle">Frio (se dissipando)</text>
</g>
<text x="16" y="186" fill="#8a96a3" font-size="11.5" font-style="italic" font-family="'DejaVu Serif',Georgia,serif">“Você já nem pergunta o que carrega.”</text>
<!-- reputação -->
<text x="16" y="216" fill="#7c8793" font-size="10" letter-spacing="2">REPUTAÇÃO</text>
<g font-size="11" fill="#aeb6bf">
  <text x="16" y="238">Regime de Qube</text><rect x="130" y="230" width="160" height="8" rx="4" fill="#1c222a"/><rect x="130" y="230" width="28" height="8" rx="4" fill="#c0392b"/><text x="344" y="238" text-anchor="end" font-size="9" fill="#c0392b">hostil</text>
  <text x="16" y="262">Guilda Mercante</text><rect x="130" y="254" width="160" height="8" rx="4" fill="#1c222a"/><rect x="130" y="254" width="126" height="8" rx="4" fill="#d9a441"/><text x="344" y="262" text-anchor="end" font-size="9" fill="#d9a441">confiável</text>
  <text x="16" y="286">Sínodo</text><rect x="130" y="278" width="160" height="8" rx="4" fill="#1c222a"/><rect x="130" y="278" width="82" height="8" rx="4" fill="#8b6fc4"/><text x="344" y="286" text-anchor="end" font-size="9" fill="#8b6fc4">neutro</text>
  <text x="16" y="310">Cartel de Diusreza</text><rect x="130" y="302" width="160" height="8" rx="4" fill="#1c222a"/><rect x="130" y="302" width="105" height="8" rx="4" fill="#3fa7a0"/><text x="344" y="310" text-anchor="end" font-size="9" fill="#3fa7a0">útil</text>
</g>
<!-- linhas do livro -->
<text x="16" y="342" fill="#7c8793" font-size="10" letter-spacing="2">ENTRADAS</text>
<g font-family="'DejaVu Serif',Georgia,serif" font-size="11.5">
  <line x1="16" y1="350" x2="344" y2="350" stroke="#1c222a"/>
  <text x="16" y="368" fill="#7c8793" font-size="9" font-family="'DejaVu Sans Mono',monospace">DIA 143 · AUSIS</text>
  <text x="16" y="386" fill="#d8dde3">Entregou 12 t de comida a Qube durante o</text>
  <text x="16" y="402" fill="#d8dde3">racionamento. A fila diminuiu por uma semana.</text>
  <line x1="16" y1="412" x2="344" y2="412" stroke="#1c222a"/>
  <text x="16" y="430" fill="#7c8793" font-size="9" font-family="'DejaVu Sans Mono',monospace">DIA 131 · TIBEDIED</text>
  <text x="16" y="448" fill="#d8dde3">Pagou propina ao cap. Doran. Ele aceitou</text>
  <text x="16" y="464" fill="#d8dde3">rápido demais. Você não esqueceu o nome dele.</text>
  <line x1="16" y1="474" x2="344" y2="474" stroke="#1c222a"/>
  <text x="16" y="492" fill="#c0392b" font-size="9" font-family="'DejaVu Sans Mono',monospace">DIA 118 · ZAATXE · MARCA PERMANENTE</text>
  <text x="16" y="510" fill="#d8dde3">Um oficial da Guilda morreu no porão da sua</text>
  <text x="16" y="526" fill="#d8dde3">nave. Ele se chamava <tspan fill="#e07a6a" font-weight="bold">Teo Marrec</tspan>. Tinha uma irmã.</text>
  <line x1="16" y1="536" x2="344" y2="536" stroke="#1c222a"/>
</g>
<!-- consequência pendente -->
<rect x="10" y="550" width="340" height="96" rx="8" fill="#140d0e" stroke="#4a2020"/>
<text x="24" y="572" fill="#e07a6a" font-size="10" letter-spacing="2">CONSEQUÊNCIA EM ABERTO</text>
<g font-family="'DejaVu Serif',Georgia,serif" font-size="12" fill="#d8dde3">
  <text x="24" y="594">Marrec Kael, irmã de Teo, comprou uma</text>
  <text x="24" y="611">passagem para Ausis. Ninguém sabe se é</text>
  <text x="24" y="628">coincidência.</text>
</g>
<text x="344" y="636" text-anchor="end" fill="#a56a62" font-size="9" font-family="'DejaVu Sans Mono',monospace">chegada prevista: dia ~150</text>
<g>
  <rect x="16" y="658" width="328" height="28" rx="6" fill="none" stroke="#3a444f"/>
  <text x="180" y="676" fill="#aeb6bf" font-size="11" text-anchor="middle" letter-spacing="1">VER TODAS AS ENTRADAS (47)</text>
</g>
<rect y="700" width="360" height="40" fill="#10141a"/><line x1="0" y1="700" x2="360" y2="700" stroke="#262d36"/>
<g font-size="10" fill="#7c8793" text-anchor="middle" letter-spacing="1">
  <text x="45" y="724">MAPA</text><text x="135" y="724">ESTAÇÃO</text><text x="225" y="724">DOSSIÊ</text><text x="315" y="724" fill="#d9a441">LIVRO</text>
</g>
</svg>
