<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740" font-family="'Liberation Sans','DejaVu Sans',sans-serif">
<defs>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c0392b" stop-opacity=".5"/><stop offset="1" stop-color="#c0392b" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0d10" stop-opacity="0"/><stop offset="1" stop-color="#0b0d10"/></linearGradient>
</defs>
<rect width="360" height="740" fill="#0b0d10"/>
<!-- cena: patrulha emerge do escuro -->
<rect width="360" height="250" fill="#0a0709"/>
<circle cx="180" cy="120" r="140" fill="url(#glow)"/>
<g fill="none" stroke="#2a1a1c" stroke-width="1"><circle cx="180" cy="120" r="50"/><circle cx="180" cy="120" r="90"/><circle cx="180" cy="120" r="130"/></g>
<g transform="translate(180 118)">
  <path d="M-92 18 L-30 -6 L-18 -34 L0 -50 L18 -34 L30 -6 L92 18 L40 26 L18 52 L0 58 L-18 52 L-40 26 Z" fill="#131012" stroke="#6b2a26" stroke-width="1.5"/>
  <path d="M-30 -6 L-12 12 L12 12 L30 -6" fill="none" stroke="#6b2a26"/>
  <circle cx="0" cy="6" r="7" fill="#c0392b"/>
  <circle cx="-62" cy="18" r="3" fill="#e07a6a"/><circle cx="62" cy="18" r="3" fill="#e07a6a"/>
</g>
<text x="180" y="212" fill="#c0392b" font-size="11" text-anchor="middle" letter-spacing="3">PATRULHA DO REGIME · CLASSE VIGIA</text>
<text x="180" y="230" fill="#7c8793" font-size="10" text-anchor="middle" font-family="'DejaVu Sans Mono',monospace">cap. Hael Doran · doutrina: ordem acima da lei</text>
<rect y="170" width="360" height="80" fill="url(#fade)"/>
<!-- medidores -->
<g font-size="9" letter-spacing="1.5" fill="#7c8793">
  <text x="16" y="270">SEU SANGUE-FRIO</text>
  <rect x="16" y="276" width="156" height="8" rx="4" fill="#1c222a"/><rect x="16" y="276" width="104" height="8" rx="4" fill="#3fa7a0"/>
  <text x="188" y="270">DELES</text>
  <rect x="188" y="276" width="156" height="8" rx="4" fill="#1c222a"/><rect x="188" y="276" width="92" height="8" rx="4" fill="#c0392b"/>
  <text x="16" y="302">SUA ALAVANCAGEM</text>
  <rect x="16" y="308" width="156" height="8" rx="4" fill="#1c222a"/><rect x="16" y="308" width="52" height="8" rx="4" fill="#d9a441"/>
  <text x="188" y="302">ALAVANCAGEM DELES</text>
  <rect x="188" y="308" width="156" height="8" rx="4" fill="#1c222a"/><rect x="188" y="308" width="124" height="8" rx="4" fill="#c0392b"/>
</g>
<text x="344" y="338" fill="#7c8793" font-size="9" text-anchor="end" font-family="'DejaVu Sans Mono',monospace">RODADA 2 / 4</text>
<!-- narrativa -->
<rect x="10" y="346" width="340" height="112" rx="8" fill="#12161c" stroke="#262d36"/>
<g font-family="'DejaVu Serif',Georgia,serif" font-size="12.5" fill="#d8dde3">
  <text x="24" y="370">“Abra o porão, mercador. Sabemos o que</text>
  <text x="24" y="388">saiu de Ausis. O Regime não precisa de</text>
  <text x="24" y="406">prova — só de motivo.”</text>
</g>
<text x="24" y="434" fill="#8a96a3" font-size="11.5" font-style="italic" font-family="'DejaVu Serif',Georgia,serif">Suas mãos estão firmes. Isso o assusta</text>
<text x="24" y="450" fill="#8a96a3" font-size="11.5" font-style="italic" font-family="'DejaVu Serif',Georgia,serif">mais do que a patrulha.</text>
<!-- opções -->
<g font-size="12">
  <rect x="10" y="470" width="340" height="38" rx="6" fill="#12161c" stroke="#2a313a"/>
  <text x="22" y="486" fill="#d8dde3" font-weight="bold">Resistir</text><text x="22" y="500" fill="#7c8793" font-size="10">Segurar a postura · gasta sangue-frio</text>
  <rect x="10" y="514" width="340" height="38" rx="6" fill="#12161c" stroke="#2a313a"/>
  <text x="22" y="530" fill="#d8dde3" font-weight="bold">Expor um segredo</text><text x="22" y="544" fill="#7c8793" font-size="10">O cap. Doran vende passagens de refugiados · queima o segredo</text>
  <rect x="10" y="558" width="340" height="38" rx="6" fill="#12161c" stroke="#2a313a"/>
  <text x="22" y="574" fill="#d8dde3" font-weight="bold">Cobrar um favor</text><text x="22" y="588" fill="#7c8793" font-size="10">Orla, da Guilda, lhe deve uma · gasta o favor</text>
  <rect x="10" y="602" width="340" height="38" rx="6" fill="#12161c" stroke="#2a313a"/>
  <text x="22" y="618" fill="#d8dde3" font-weight="bold">Sacrificar a carga oculta</text><text x="22" y="632" fill="#7c8793" font-size="10">Joga fora 1 t · perde ~4 800 cr e a prova</text>
  <rect x="10" y="646" width="340" height="38" rx="6" fill="#140d0e" stroke="#4a2020"/>
  <text x="22" y="662" fill="#e07a6a" font-weight="bold">Partir para a violência</text><text x="22" y="676" fill="#a56a62" font-size="10">Irreversível · cria uma pessoa com nome e uma dívida</text>
</g>
<rect y="700" width="360" height="40" fill="#10141a"/><line x1="0" y1="700" x2="360" y2="700" stroke="#262d36"/>
<text x="180" y="724" fill="#7c8793" font-size="10" text-anchor="middle" letter-spacing="1" font-family="'DejaVu Sans Mono',monospace">ATENÇÃO DO REGIME ▮▮▮▮▯ · sem pausa</text>
</svg>
