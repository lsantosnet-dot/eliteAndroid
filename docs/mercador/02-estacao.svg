<text x="344" y="22" fill="#d9a441" font-size="13" text-anchor="end" font-family="'DejaVu Sans Mono',monospace">12 480 cr</text>
<text x="344" y="38" fill="#7c8793" font-size="10" text-anchor="end" font-family="'DejaVu Sans Mono',monospace">DIA 143</text>
