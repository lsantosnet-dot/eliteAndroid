  <text x="176" y="454" text-anchor="end" font-family="'DejaVu Sans Mono',monospace" fill="#d9a441">205.5</text>
  <text x="190" y="454" fill="#3fa7a0">▼ −11%</text>
  <text x="338" y="454" text-anchor="end" font-family="'DejaVu Sans Mono',monospace">8 t</text>
