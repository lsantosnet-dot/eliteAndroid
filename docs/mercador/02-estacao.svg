</g>
<!-- nota do mercado -->
<rect x="10" y="542" width="340" height="86" rx="8" fill="#12161c" stroke="#262d36"/>
<text x="24" y="564" fill="#d9a441" font-size="10" letter-spacing="1.5">LIVRO DE CONTAS · ÚLTIMA LINHA</text>
<text x="24" y="584" fill="#d8dde3" font-size="12" font-style="italic" font-family="'DejaVu Serif',Georgia,serif">Você entregou comida a Qube. A Guilda</text>
<text x="24" y="600" fill="#d8dde3" font-size="12" font-style="italic" font-family="'DejaVu Serif',Georgia,serif">pagou bem. O Regime não esqueceu quem</text>
<text x="24" y="616" fill="#d8dde3" font-size="12" font-style="italic" font-family="'DejaVu Serif',Georgia,serif">a levou até a fila do racionamento.</text>
<!-- ações -->
<rect x="16" y="644" width="152" height="34" rx="6" fill="#d9a441"/><text x="92" y="666" fill="#0b0d10" font-size="12" text-anchor="middle" font-weight="bold" letter-spacing="1">COMPRAR</text>
<rect x="192" y="644" width="152" height="34" rx="6" fill="none" stroke="#d9a441"/><text x="268" y="666" fill="#d9a441" font-size="12" text-anchor="middle" font-weight="bold" letter-spacing="1">VENDER</text>
<rect y="700" width="360" height="40" fill="#10141a"/><line x1="0" y1="700" x2="360" y2="700" stroke="#262d36"/>
