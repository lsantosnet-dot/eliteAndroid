  <radialGradient id="sun"><stop offset="0" stop-color="#d9a441" stop-opacity=".55"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/></radialGradient>
</defs>
<rect width="360" height="740" fill="#0b0d10"/>
